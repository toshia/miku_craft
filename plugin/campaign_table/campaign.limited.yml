            operation: add_value
            id: '<%= SecureRandom.uuid %>'
            slot: chest
        enchantments:
          feather_falling:
            _type: byte
            value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1)"
          unbreaking:
            _type: byte
            value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1)"
          binding_curse:
            _type: byte
            value: "rand(0..1)"
        max_damage:
          _type: auto
          value: '(Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1) + 6)**2*10'
        damage_resistant: { types: '#minecraft:is_<%= %w[fire explosion].sample %>' }
