- name: "1.21.5アップデート(Spring to Life)キャンペーン！装備復刻祭り！"
  start: [2025, 6, 9]
  end:   [2025, 6, 15]
  type: item_random
  table:
    - id: 'minecraft:leather_boots'
      NBT:
        lore: |-
          1.21.5アップデート(Spring to Life)キャンペーン！
          装備復刻祭り
          革のブーツを履いて2.5ブロック以上落下してから
          粉雪に着地した時、突き抜けて下に落ちるようになった
        attribute_modifiers:
          - type: "armor"
            amount:
              _type: byte
              value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1) + 1"
            operation: add_value
            id: '<%= SecureRandom.uuid %>'
            slot: feet
          - type: "movement_speed"
            amount:
              _type: auto
              value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1).to_f * 0.05"
            operation: add_multiplied_total
            id: '<%= SecureRandom.uuid %>'
            slot: feet
        enchantments:
          feather_falling:
            _type: byte
            value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1)"
          frost_walker:
            _type: byte
            value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1)"
          unbreaking:
            _type: byte
            value: "Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1)"
          binding_curse:
            _type: byte
            value: "rand(0..1)"
        max_damage:
          _type: auto
          value: '(Enumerator.new{|y| loop{ y << rand(2) } }.find_index(1) + 2)**2*10'
        damage_resistant: { types: '#minecraft:is_<%= %w[fire explosion].sample %>' }
    - id: 'minecraft:elytra'
      NBT:
        lore: |-
          1.21.5アップデート(Spring to Life)キャンペーン！
