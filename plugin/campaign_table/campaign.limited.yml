- name: "1.21.2アップデート(Bundles of Bravery)キャンペーン！旗の模様祭り"
  start: [2024, 11, 9]
  end:   [2024, 11, 23]
  type: item_random
  table:
    - id: 'minecraft:field_masoned_banner_pattern'
      NBT:
        custom_name: レンガの旗の模様
        lore: |-
          1.21.2アップデート(Bundles of Bravery)キャンペーン！
          旗の模様祭り
          統合版にあったレンガ模様が追加された
          紙とレンガブロックをクラフトすれば作れる
        death_protection: &death_protection1212
          death_effects:
            - type: clear_all_effects
            - type: apply_effects
              effects:
                - id: absorption
                  amplifier: 0
                  duration: 200
                - id: regeneration
                  amplifier: 4
                  duration: 200
                - id: fire_resistance
                  duration: 200
                - id: water_breathing
                  duration: 200
                - id: invisibility
                  duration: 200
            - type: teleport_randomly
    - id: 'minecraft:bordure_indented_banner_pattern'
      NBT:
        custom_name: 山形波の縁取りの旗の模様
        lore: |-
          1.21.2アップデート(Bundles of Bravery)キャンペーン！
          旗の模様祭り
          統合版にあったレンガ模様が追加された
          紙と蔦をクラフトすれば作れる
        death_protection: *death_protection1212

